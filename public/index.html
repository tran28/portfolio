<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#eee8dc" />
    <!-- Apply a stored dark pick before first paint; ThemeProvider takes over once React mounts.
         #161412 mirrors html.dark --paper in index.css. -->
    <script>
      try {
        if (localStorage.getItem('mt-theme') === 'dark') {
          document.documentElement.classList.add('dark');
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#161412');
        }
      } catch (e) {}
    </script>

    <!-- Favicons (generated via realfavicongenerator.net) -->
    <link rel="icon" type="image/x-icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="icon" type="image/png" sizes="96x96" href="%PUBLIC_URL%/favicon-96x96.png" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/site.webmanifest" />

    <meta name="author" content="Matthew Tran" />
    <meta
      name="description"
      content="Matthew Tran — Software Engineer. Product engineering, full stack. Toronto, ON."
    />
    <title>Matthew Tran / Software Engineer</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
