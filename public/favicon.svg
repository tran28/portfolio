<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&amp;display=swap');
    .bg { fill: #eee8dc; }
    .ink { fill: #1c1a18; }
    .accent { fill: #5c6038; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #161412; }
      .ink { fill: #ede4d3; }
      .accent { fill: #c46e4a; }
    }
  </style>
  <rect class="bg" width="64" height="64" rx="10"/>
  <text
    x="50%"
    y="58%"
    text-anchor="middle"
    dominant-baseline="middle"
    font-family="'Instrument Serif', 'Times New Roman', serif"
    font-style="italic"
    font-size="42"
    class="ink"
  >m<tspan class="accent">.</tspan>t<tspan class="accent">.</tspan></text>
</svg>
